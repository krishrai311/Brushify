<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Brushify</title>
</head>
<body>
    <center>
        <h1>Brushify</h1>
        <br><br><br><br>
        <div id="editor" contenteditable="true"></div>
        <br><br>
        <div id="parent">
            <div id="child">
                <h1>Backgroundcolor</h1>
                <br><br>
                <button class="bg" onclick="bgc('blue')"  style="background-color: orange;"></button>
                <button class="bg" onclick="bgc('black')" style="background-color:blue ;" ></button>
                 <button class="bg" onclick="bgc('pink')" style="background-color: pink;" ></button>
                 <button class="bg" onclick="bgc('orange')" style="background-color: green;" ></button>
                 <button class="bg" onclick="bgc('red')" style="background-color: red;" ></button>
             </div>
              <div id="child">
                <h1>Textcolor</h1>
                <br><br>
                <button class="bg" onclick="Textcolor('blue')" style="background-color: blue;"></button>
                <button class="bg" onclick="Textcolor('black')" style="background-color: white;"></button>
                <button class="bg" onclick="Textcolor('pink')" style="background-color: navy;"></button>
                <button class="bg" onclick="Textcolor('red')" style="background-color: fuchsia;"></button>
                <button class="bg" onclick="Textcolor('skyblue')" style="background-color: skyblue;"></button>
            </div>
              <div id="child">
                <h1>FontStyle</h1>
                <br><br>
                <button class="fnt" onclick="font('sans-serif')" >GLA</button>
                <button class="fnt" onclick="font('serif')"      >GLA</button>
                <button class="fnt" onclick="font('monospace')"  >GLA</button>
                <button class="fnt" onclick="font('cursive')"    >GLA</button>
                <button class="fnt" onclick="font('fantasy')">GLA</button>
            </div>
        </div>
    </center>

    <script>
        function bgc(color){
            document.getElementById('editor').style.backgroundColor = color
        }
         function Textcolor(color){
            document.getElementById('editor').style.color = color
        }
         function font(font){
            document.getElementById('editor').style.fontFamily = font
        }
    </script>

</body>
</html>
